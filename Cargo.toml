[package]
name = "inscope"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
worker = { version = "0.8.7", features = ["d1"] }
console_error_panic_hook = "0.1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"


[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
